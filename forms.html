<form>
    <input type="text" name="email"/>
    <input type="password" name="password"/><br/>

    <input type="radio" name="gender" value="male"/>Male
    <input type="radio" name="gender" value="female"/>Female
    <input type="radio" name="gender" value="other"/>Other<br/>

    <input type="checkbox" name="interest" value="cricket"/>Cricket
    <input type="checkbox" name="interest" value="badminton"/>Badminton
    <input type="checkbox" name="interest" value="football"/>Football<br/>
    <br/>
    <select name="city">
        <option value="kolkata">Kolkata</option>
        <option value="delhi">Delhi</option>
        <option value="mumbai">Mumbai</option>
        <option value="Lucknow">Lucknow</option>
    </select><br/>
    <textarea name="address" rows="5" cols="50">
        Write your address.....
    </textarea><br/>

    <input type="submit" name="submit" value="Submit"/>


</form>
